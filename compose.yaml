name: ue03-telemetrie
services:
  app:
    build: .
    image: ue03-telemetrie:local
    environment:
      LOG_STDOUT: "0"
      SPEED: "10"
    ports: ["127.0.0.1:18080:8080"]
    volumes: ["app-logs:/app/logs"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  loadgen:
    image: ue03-telemetrie:local
    pull_policy: never
    command: ["node", "scripts/loadgen.js", "--url", "http://app:8080", "--rps", "5", "--burst-rps", "30"]
    depends_on:
      app: {condition: service_healthy}
    healthcheck: {disable: true}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
  history:
    image: ue03-telemetrie:local
    pull_policy: never
    command: ["node", "scripts/import-loki.js"]
    environment: {LOKI_URL: "http://loki:3100"}
    volumes: ["./data:/app/data:ro"]
    depends_on: [loki]
    healthcheck: {disable: true}
    restart: on-failure
  alloy:
    image: grafana/alloy:v1.10.2
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes: ["./observability/alloy.alloy:/etc/alloy/config.alloy:ro", "app-logs:/logs:ro", "alloy-data:/var/lib/alloy/data"]
    depends_on: [loki, app]
    restart: unless-stopped
  loki:
    image: grafana/loki:3.5.7
    command: ["-config.file=/etc/loki/config.yaml"]
    ports: ["127.0.0.1:13100:3100"]
    volumes: ["./observability/loki.yaml:/etc/loki/config.yaml:ro", "loki-data:/loki"]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.6.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    ports: ["127.0.0.1:19090:9090"]
    volumes: ["./observability/prometheus:/etc/prometheus:ro", "prometheus-data:/prometheus"]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    ports: ["127.0.0.1:13000:3000"]
    volumes: ["./observability/grafana/provisioning:/etc/grafana/provisioning:ro", "./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro", "grafana-data:/var/lib/grafana"]
    depends_on: [loki, prometheus]
    restart: unless-stopped
volumes:
  app-logs:
  alloy-data:
  loki-data:
  prometheus-data:
  grafana-data:
